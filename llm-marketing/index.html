<!DOCTYPE html>
<html lang="en">
<head>

<meta property="og:title" content="LLMs for marketing research">
<meta property="og:description" content="A curated reading list of research on large language models for marketing, with short summaries of the papers.">

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fcfcfb;
    --surface: #f4f4f2;
    --line: #e6e5e1;
    --ink: #141414;
    --muted: #666666;
    --field: #ffffff;
    --glass: rgb(252 252 251 / .78);
    --grad-from: #000000;
    --grad-to: #666666;
    --sim: #3f63b8;
    --gen: #b25b2a;
    --alg: #7a4db0;
    --utd: #0f766e;
    --ns: #be123c;
    --ml: #92400e;
    --focus: #2563eb;
    --shadow: 0 12px 32px rgb(20 20 20 / .12);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    /* Spacing scale: nothing between or outside these values. */
    --s-25: 2px; --s-50: 4px; --s-75: 8px; --s-100: 12px; --s-200: 16px; --s-300: 24px;
    --s-400: 32px; --s-500: 40px; --s-600: 48px; --s-700: 64px; --s-800: 80px; --s-900: 96px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181818;
      --surface: #1f1f1f;
      --line: #313131;
      --ink: #ededed;
      --muted: #a3a3a3;
      --field: #1f1f1f;
      --glass: rgb(24 24 24 / .78);
      --grad-from: #ffffff;
      --grad-to: #9b9b9b;
      --sim: #8aa6ee;
      --gen: #eba06f;
      --alg: #bb98ea;
      --utd: #5eead4;
      --ns: #fb7185;
      --ml: #fbbf24;
      --focus: #93b4ff;
      --shadow: 0 12px 32px rgb(0 0 0 / .5);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: var(--s-200); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 24px;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  p { margin: 0; text-wrap: pretty; }
  a { color: inherit; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 3px; }
  a:hover { text-decoration-color: currentColor; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
  button { font: inherit; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .skip { position: absolute; left: var(--s-200); top: var(--s-200); z-index: 20; padding: var(--s-75) var(--s-100); border-radius: 8px; background: var(--ink); color: var(--bg); transform: translateY(-200%); }
  .skip:focus { transform: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--s-400); }
  .muted { color: var(--muted); }

  /* Text styles */
  .heading-1 { font-size: 60px; line-height: 60px; font-weight: 600; letter-spacing: -0.03em; }
  .heading-4 { font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.02em; }
  .heading-6 { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; }
  .title-2 { font-size: 18px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em; }
  .title-3 { font-size: 16px; line-height: 24px; font-weight: 500; }
  .title-4 { font-size: 14px; line-height: 20px; font-weight: 500; }
  .body-3 { font-size: 16px; line-height: 24px; font-weight: 400; }
  .body-6 { font-size: 14px; line-height: 20px; font-weight: 400; }
  .body-7 { font-size: 18px; line-height: 28px; font-weight: 400; }
  .button-md { font-size: 16px; line-height: 24px; font-weight: 600; }
  .button-sm { font-size: 14px; line-height: 20px; font-weight: 600; }
  .caption-2 { font-size: 14px; line-height: 20px; font-weight: 400; }
  .caption-3 { font-size: 12px; line-height: 16px; font-weight: 600; }

  /* Hero */
  header.hero { padding: var(--s-900) 0 var(--s-300); }
  .hero h1 {
    white-space: nowrap;
    background: linear-gradient(90deg, var(--grad-from), var(--grad-to));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .lede { margin-top: var(--s-300); color: var(--muted); white-space: nowrap; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-100) var(--s-300); margin-top: var(--s-400); }
  .btn {
    display: inline-flex; align-items: center; gap: var(--s-75); padding: var(--s-75) var(--s-100); border-radius: 8px;
    background: var(--ink); color: var(--bg); text-decoration: none; border: 0; cursor: pointer;
    transition: opacity .3s var(--ease), transform .3s var(--ease);
  }
  .btn:hover { opacity: .86; }
  .btn:active { transform: scale(0.98); }
  .proof { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-75); }
  .vchip {
    display: inline-flex; align-items: baseline; gap: var(--s-75); padding: var(--s-50) var(--s-100);
    border: 0; border-radius: 9999px; cursor: pointer; color: var(--t);
    background: color-mix(in srgb, var(--t) 12%, transparent);
    transition: background-color .3s var(--ease), color .3s var(--ease), transform .3s var(--ease);
  }
  .vchip span { font-weight: 400; opacity: .8; }
  .vchip:hover { background: color-mix(in srgb, var(--t) 20%, transparent); }
  .vchip:active { transform: scale(0.98); }
  .vchip[aria-pressed="true"] { background: var(--t); color: var(--bg); }
  .proof .updated { padding: 0 var(--s-75); }
  @media (prefers-reduced-motion: no-preference) {
    .hero > * { animation: rise .8s var(--ease) backwards; }
    .hero > :nth-child(2) { animation-delay: 60ms; }
    .hero > :nth-child(3) { animation-delay: 120ms; }
    .hero > :nth-child(4) { animation-delay: 180ms; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(var(--s-400)); } }
  @keyframes fade { from { opacity: 0; } }

  /* The field: one dot per paper, stacked by year, coloured by direction */
  .field { position: relative; margin: var(--s-700) 0 0; }
  .cols { display: grid; grid-template-columns: repeat(var(--n), auto); justify-content: space-between; align-items: end; gap: var(--s-300); }
  .col { display: flex; flex-direction: column; }
  .dots { --per: 10; --dot: 16px; --gap: 4px; display: flex; flex-wrap: wrap-reverse; gap: var(--gap); width: calc(var(--per) * (var(--dot) + var(--gap)) - var(--gap)); }
  .dot {
    display: block; width: var(--dot); height: var(--dot); border-radius: 9999px; background: var(--c); cursor: pointer;
    transition: transform .3s var(--ease), opacity .3s var(--ease);
  }
  .dot:hover, .dot.on { transform: scale(1.6); }
  .dot.dim { opacity: .14; }
  /* Hovering a direction or venue previews its dots before any click. */
  #cols[data-pc="1"] .dot:not([data-c="1"]), #cols[data-pc="2"] .dot:not([data-c="2"]), #cols[data-pc="3"] .dot:not([data-c="3"]),
  #cols[data-pv="utd24"] .dot:not([data-v="utd24"]), #cols[data-pv="natsci"] .dot:not([data-v="natsci"]), #cols[data-pv="mlnlp"] .dot:not([data-v="mlnlp"]) { opacity: .14; }
  .year { display: flex; align-items: baseline; gap: var(--s-75); margin-top: var(--s-100); padding-top: var(--s-75); border-top: 1px solid var(--line); }
  @media (prefers-reduced-motion: no-preference) {
    .dot { animation: pop .7s var(--ease) backwards; animation-delay: var(--d); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: fade .4s var(--ease) backwards; }
  }
  @keyframes pop { from { opacity: 0; transform: translateY(var(--s-200)) scale(.4); } }
  .tip {
    position: absolute; z-index: 6; width: 320px; padding: var(--s-100) var(--s-200);
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg); box-shadow: var(--shadow);
    pointer-events: none; transform: translate(-50%, calc(-100% - var(--s-100)));
  }
  .tip p + p { margin-top: var(--s-50); }
  .tip .where { margin-top: var(--s-50); }
  .field-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--s-100) var(--s-300); margin-top: var(--s-300); }
  .legend { display: flex; flex-wrap: wrap; gap: var(--s-75); }
  .dir {
    display: inline-flex; align-items: center; gap: var(--s-75); padding: var(--s-50) var(--s-100);
    border: 1px solid var(--line); border-radius: 9999px; background: transparent; color: var(--ink); cursor: pointer;
    transition: background-color .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease);
  }
  .dir i { width: 8px; height: 8px; border-radius: 9999px; background: var(--c); }
  .dir span { color: var(--muted); font-weight: 400; }
  .dir:hover { border-color: var(--c); }
  .dir:active { transform: scale(0.98); }
  .dir[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }

  /* Foundational papers */
  section.start { padding: var(--s-800) 0 0; }
  .section-head { padding-bottom: var(--s-200); }
  .section-head p { margin-top: var(--s-75); }

  /* Toolbar: floats over the list while it scrolls */
  .toolbar {
    position: sticky; top: var(--s-100); z-index: 10; margin-top: var(--s-800);
    display: flex; flex-wrap: wrap; gap: var(--s-100); align-items: center;
    padding: var(--s-100); border: 1px solid var(--line); border-radius: 24px;
    background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  }
  .search { position: relative; flex: 1 1 260px; }
  .search svg { position: absolute; left: var(--s-100); top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 1px solid var(--line); border-radius: 12px; padding: var(--s-75) var(--s-100) var(--s-75) var(--s-500);
    transition: border-color .3s var(--ease);
  }
  .search input:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
  .search input::placeholder { color: var(--muted); }
  .group { display: flex; flex-wrap: wrap; gap: var(--s-50); align-items: center; }
  .group > .label { color: var(--muted); margin: 0 var(--s-50) 0 var(--s-75); }
  .chip {
    color: var(--ink); background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: 9999px; padding: var(--s-50) var(--s-100);
    transition: background-color .3s var(--ease), border-color .3s var(--ease), color .3s var(--ease), transform .3s var(--ease);
  }
  .chip:hover { border-color: var(--c, var(--ink)); }
  .chip:active { transform: scale(0.98); }
  .chip[aria-pressed="true"] { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); color: var(--bg); }
  .row2 { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-100) var(--s-300); width: 100%; }
  .toggles { display: flex; flex-wrap: wrap; gap: var(--s-200); align-items: center; color: var(--muted); }
  .toggles label { display: inline-flex; gap: var(--s-75); align-items: center; cursor: pointer; }
  .toggles input { accent-color: var(--ink); width: 16px; height: 16px; margin: 0; }
  .toggles select { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: var(--s-25) var(--s-75); }
  .status { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s-75) var(--s-300); width: 100%; padding: 0 var(--s-75); color: var(--muted); }
  .link-btn { color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 30%, transparent); text-underline-offset: 3px; }
  .link-btn:hover { text-decoration-color: currentColor; }

  /* Catalogue */
  .cat { padding-top: var(--s-700); }
  .cat > h2 { color: var(--c); }
  .cat > p { max-width: 680px; margin-top: var(--s-75); }
  .subsec { margin-top: var(--s-500); }
  .subsec h3 { display: flex; gap: var(--s-100); align-items: baseline; padding-bottom: var(--s-100); }
  .subsec h3 .n { color: var(--muted); font-weight: 400; font-size: 14px; }
  ul.entries { list-style: none; margin: 0; padding: 0; }
  .entry {
    display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 0 var(--s-300);
    padding: var(--s-300) 0; border-top: 1px solid var(--line); scroll-margin-top: 160px;
  }
  .entry .yr { color: var(--c); font-variant-numeric: tabular-nums; padding-top: var(--s-25); }
  .t { text-decoration: none; }
  .t:hover { text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }
  .who { margin-top: var(--s-50); }
  .where { margin-top: var(--s-25); color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-50) var(--s-75); }
  .tag { border-radius: 9999px; padding: 0 var(--s-75); color: var(--t); background: color-mix(in srgb, var(--t) 12%, transparent); white-space: nowrap; }
  .data { margin-top: var(--s-75); color: var(--muted); display: flex; gap: var(--s-75); align-items: flex-start; }
  .data svg { margin-top: var(--s-25); color: var(--c, var(--muted)); }
  .data a { color: var(--ink); font-weight: 500; }
  .tldr-btn {
    display: inline-flex; align-items: center; gap: var(--s-50); align-self: start;
    color: var(--muted); background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: 9999px; padding: var(--s-25) var(--s-100);
    transition: color .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease);
  }
  .tldr-btn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 35%, var(--line)); }
  .tldr-btn:active { transform: scale(0.98); }
  .tldr-btn svg { transition: transform .3s var(--ease); }
  .tldr-btn[aria-expanded="true"] { color: var(--ink); }
  .tldr-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .tldr { grid-column: 2 / -1; margin-top: var(--s-200); padding: var(--s-200); border-radius: 12px; background: var(--surface); max-width: 760px; }
  @media (prefers-reduced-motion: no-preference) { .tldr:not([hidden]) { animation: open .5s var(--ease); } }
  @media (prefers-reduced-motion: reduce) { .tldr:not([hidden]) { animation: fade .3s var(--ease); } }
  @keyframes open { from { opacity: 0; transform: translateY(calc(-1 * var(--s-75))); } }
  .entry.hit { background: color-mix(in srgb, var(--c) 8%, transparent); border-radius: 12px; padding-left: var(--s-200); padding-right: var(--s-200); margin: 0 calc(-1 * var(--s-200)); }

  /* Loading, empty, error */
  .skeleton { padding: var(--s-300) 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 56px 1fr; gap: var(--s-300); }
  .skeleton i { display: block; height: 12px; border-radius: 4px; background: var(--surface); }
  .skeleton div i + i { margin-top: var(--s-100); }
  .notice { margin-top: var(--s-600); padding: var(--s-600) var(--s-300); border: 1px solid var(--line); border-radius: 16px; text-align: center; }
  .notice p + * { margin-top: var(--s-200); }

  .reveal { opacity: 0; transform: translateY(var(--s-400)); transition: opacity .7s var(--ease), transform .7s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { transform: none; } }

  footer { margin-top: var(--s-900); padding: var(--s-400) 0 var(--s-600); border-top: 1px solid var(--line); color: var(--muted); }

  @media (max-width: 1099px) {
    .hero h1 { font-size: 48px; line-height: 48px; }
    .hero .lede { white-space: normal; }
    .cols { gap: var(--s-200); }
    .dots { --per: 8; --dot: 12px; }
  }
  @media (max-width: 760px) {
    .wrap { padding: 0 var(--s-200); }
    header.hero { padding-top: var(--s-700); }
    .hero h1 { font-size: 36px; line-height: 40px; white-space: normal; }
    .hero .lede { font-size: 16px; line-height: 24px; }
    .field { margin-top: var(--s-500); }
    .cols { gap: var(--s-100); }
    .dots { --per: 5; --dot: 8px; --gap: 2px; }
    .year { flex-direction: column; gap: 0; }
    .proof .updated { padding: 0; width: 100%; }
    .tip { display: none; }
    .toolbar { position: static; border-radius: 16px; }
    .search input { border-radius: 4px; }
    .entry { grid-template-columns: minmax(0, 1fr); }
    .entry .yr { padding: 0; }
    .entry .tldr-btn { justify-self: start; margin-top: var(--s-100); }
    .tldr { grid-column: 1; }
    .entry { scroll-margin-top: var(--s-200); }
  }
</style>
</head>
<body>
<a class="skip button-sm" href="#catalogue">Skip to papers</a>
<div class="wrap">
  <header class="hero">
    <h1 class="heading-1">LLMs for marketing research</h1>
    <p class="lede body-7" id="lede">Papers on LLMs that simulate consumers, generate marketing content, and improve marketing models.</p>
    <div class="actions">
      <a class="btn button-md" href="#catalogue" id="browse">Browse the papers</a>
      <div class="proof button-sm" id="proof" role="group" aria-label="Venue"></div>
    </div>
    <figure class="field" id="field" aria-label="Papers by year and research direction">
      <div class="cols" id="cols" aria-hidden="true"></div>
      <div class="tip" id="tip" hidden></div>
      <div class="field-foot">
        <div class="legend button-sm" id="legend" role="group" aria-label="Research direction"></div>
        <figcaption class="caption-2 muted" id="field-cap" aria-live="polite"></figcaption>
      </div>
    </figure>
  </header>

  <section class="start" aria-labelledby="start-h" id="start">
    <div class="section-head">
      <h2 class="heading-4" id="start-h">Foundational papers</h2>
      <p class="body-3 muted">Five papers to read first.</p>
    </div>
    <ul class="entries" id="foundational"></ul>
  </section>

  <div class="toolbar" id="toolbar" role="search">
    <div class="search">
      <label for="q" class="sr">Search papers</label>
      <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/></svg>
      <input id="q" class="body-3" type="search" placeholder="Search titles, authors, summaries" autocomplete="off">
    </div>
    <div class="group button-sm" id="chips" role="group" aria-label="Research direction"></div>
    <div class="row2">
      <div class="group button-sm" id="venues" role="group" aria-label="Venue"><span class="label title-4">Venue</span></div>
      <div class="toggles title-4">
        <label><input type="checkbox" id="published"> Published only</label>
        <label><input type="checkbox" id="datasets"> With data</label>
        <label>Order
          <select id="sort" class="title-4">
            <option value="collection">By section</option>
            <option value="newest">Newest first</option>
          </select>
        </label>
      </div>
    </div>
    <div class="status caption-2">
      <p id="status" aria-live="polite"></p>
      <button class="link-btn" type="button" id="expand"></button>
    </div>
  </div>

  <main id="catalogue" tabindex="-1">
    <div aria-hidden="true">
      <div class="skeleton"><i></i><div><i style="width:62%"></i><i style="width:38%"></i><i style="width:24%"></i></div></div>
      <div class="skeleton"><i></i><div><i style="width:54%"></i><i style="width:31%"></i><i style="width:27%"></i></div></div>
      <div class="skeleton"><i></i><div><i style="width:70%"></i><i style="width:35%"></i><i style="width:22%"></i></div></div>
    </div>
  </main>

  <footer class="caption-2">
    <p id="foot"></p>
  </footer>
</div>

<script>
(() => {
  const COLORS = { "1": "var(--sim)", "2": "var(--gen)", "3": "var(--alg)" };
  const SHORT = { "1": "Consumer simulation", "2": "Content generation", "3": "Model augmentation" };
  const VENUES = { utd24: "UTD24", natsci: "Nature & Science", mlnlp: "ML & NLP" };
  const VCOLOR = { utd24: "var(--utd)", natsci: "var(--ns)", mlnlp: "var(--ml)" };
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const ICON = {
    caret: "M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z",
    data: "M128,24C74.17,24,32,48.6,32,80v96c0,31.4,42.17,56,96,56s96-24.6,96-56V80C224,48.6,181.83,24,128,24Zm80,104c0,9.62-7.88,19.43-21.61,26.92C170.93,163.35,150.19,168,128,168s-42.93-4.65-58.39-13.08C55.88,147.43,48,137.62,48,128V111.36c17.06,15,46.23,24.64,80,24.64s62.94-9.68,80-24.64ZM69.61,53.08C85.07,44.65,105.81,40,128,40s42.93,4.65,58.39,13.08C200.12,60.57,208,70.38,208,80s-7.88,19.43-21.61,26.92C170.93,115.35,150.19,120,128,120s-42.93-4.65-58.39-13.08C55.88,99.43,48,89.62,48,80S55.88,60.57,69.61,53.08ZM186.39,202.92C170.93,211.35,150.19,216,128,216s-42.93-4.65-58.39-13.08C55.88,195.43,48,185.62,48,176V159.36c17.06,15,46.23,24.64,80,24.64s62.94-9.68,80-24.64V176C208,185.62,200.12,195.43,186.39,202.92Z",
  };
  const state = { q: "", cat: null, venue: null, published: false, datasets: false, sort: "collection" };
  const opened = new Set();
  let openAll = false, data, uid = 0, revealed = false, field = [];
  const calm = matchMedia("(prefers-reduced-motion: reduce)");

  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "style") n.style.cssText = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k);
    return n;
  };
  const icon = name => {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 256 256");
    s.setAttribute("aria-hidden", "true");
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", ICON[name]);
    s.append(p);
    return s;
  };
  const authors = a => /et al$/.test(a) ? a + "." : a;
  const when = e => e.year ? (e.month ? `${MONTHS[e.month - 1]} ${e.year}` : `${e.year}`) : "";
  const fold = s => (s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();
  // README headings are title case; the page uses sentence case. Acronyms such as LLMs are left alone.
  const sentence = s => s.replace(/\b([A-Z])([a-z]+)\b/g, (m, a, b, i) => i === 0 ? m : a.toLowerCase() + b);
  const capital = s => s ? s[0].toUpperCase() + s.slice(1) + "." : "";
  const longDate = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  const tag = e => e.label ? el("span", { class: "tag caption-3", style: `--t:${VCOLOR[e.label]}` }, VENUES[e.label]) : null;
  // Every paper in the list once, with its direction (dataset sections repeat a few papers).
  const listed = () => data.categories.flatMap(c => c.subsections.flatMap(s => s.entries.filter(e => !e.canonical).map(e => [e, c.id])));
  const total = () => data.categories.reduce((s, c) => s + c.count, 0);

  // Sections fade up once, on the first render only; later filtering redraws in place.
  const io = "IntersectionObserver" in window ? new IntersectionObserver(items => items.forEach(x => {
    if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); }
  }), { rootMargin: "0px 0px -8% 0px" }) : null;
  const reveal = n => { if (io && !revealed) { n.classList.add("reveal"); io.observe(n); } return n; };

  const anchor = () => /^#(paper|dataset)-/.test(location.hash) ? decodeURIComponent(location.hash.slice(1)) : null;
  // A link to one paper shows the full list so the paper is there to scroll to.
  function readHash() {
    const p = new URLSearchParams(anchor() ? "" : location.hash.slice(1));
    state.q = p.get("q") || "";
    state.cat = ["1", "2", "3"].includes(p.get("cat")) ? p.get("cat") : null;
    state.venue = p.get("venue") in VENUES ? p.get("venue") : null;
    state.published = p.get("published") === "1";
    state.datasets = p.get("datasets") === "1";
    state.sort = p.get("sort") === "newest" ? "newest" : "collection";
  }
  function writeHash() {
    const p = new URLSearchParams();
    if (state.q) p.set("q", state.q);
    if (state.cat) p.set("cat", state.cat);
    if (state.venue) p.set("venue", state.venue);
    if (state.published) p.set("published", "1");
    if (state.datasets) p.set("datasets", "1");
    if (state.sort !== "collection") p.set("sort", state.sort);
    const h = p.toString();
    // Keep a link to a single paper (#paper-…) until a filter replaces it.
    if (!h && anchor()) return;
    history.replaceState(null, "", h ? "#" + h : location.pathname);
  }

  const toList = () => document.getElementById("toolbar").scrollIntoView({ behavior: calm.matches ? "auto" : "smooth" });
  function setCat(id) { state.cat = state.cat === id ? null : id; render(); }
  function setVenue(id) { state.venue = state.venue === id ? null : id; render(); }
  function jumpTo(id) { history.replaceState(null, "", "#" + id); follow(); }

  function summary(e) {
    if (!e.tldr) return [];
    const id = `tldr-${uid++}`, open = openAll || opened.has(e.title);
    const panel = el("div", { class: "tldr body-3", id, hidden: !open }, el("p", {}, e.tldr));
    const btn = el("button", { class: "tldr-btn caption-3", type: "button", "aria-expanded": String(open), "aria-controls": id,
      "aria-label": `Summary of ${e.title}`, onclick: () => {
        const now = btn.getAttribute("aria-expanded") !== "true";
        btn.setAttribute("aria-expanded", String(now));
        panel.hidden = !now;
        now ? opened.add(e.title) : opened.delete(e.title);
      } }, el("span", { "aria-hidden": "true" }, "TL;DR"), icon("caret"));
    return [btn, panel];
  }

  function meta(e, section) {
    return [
      el("a", { class: "t title-2", href: e.url, rel: "noopener" }, e.title),
      el("p", { class: "who body-6" }, authors(e.authors)),
      el("p", { class: "where caption-2" },
        el("span", {}, [e.venue || "Working paper", e.note ? `, ${e.note}` : "", when(e) ? `, ${when(e)}` : "", section ? `. ${section}` : ""].join("")),
        tag(e)),
      e.data_url ? el("p", { class: "data caption-2" }, icon("data"),
        el("span", {}, e.data_desc ? `${e.data_desc} ` : "", el("a", { href: e.data_url, rel: "noopener" }, "Get the data"))) : null,
    ];
  }

  function entryNode(e, color, section) {
    const [btn, panel] = summary(e);
    return el("li", { class: "entry", id: e.anchor && !e.canonical ? e.anchor : (e.dataset_anchor || null), style: `--c:${color}` },
      el("div", { class: "yr title-3" }, e.year ? String(e.year) : ""),
      el("div", {}, meta(e, section)),
      btn, panel);
  }

  // The field: papers stacked into one column per recent year, older ones together.
  function renderField() {
    const rows = listed();
    const last = Math.max(...rows.map(([e]) => e.year || 0)), first = last - 3;
    const buckets = [[`Before ${first}`, ([e]) => (e.year || 0) < first]]
      .concat([0, 1, 2, 3].map(i => [String(first + i), ([e]) => e.year === first + i]));
    const cols = document.getElementById("cols");
    const order = (a, b) => a[1].localeCompare(b[1]) || (a[0].year || 0) - (b[0].year || 0) || (a[0].month || 0) - (b[0].month || 0);
    buckets.forEach(([label, test], ci) => {
      const these = rows.filter(test).sort(order);
      const dots = these.map(([e, cid], i) => {
        field.push([e, cid]);
        // Plain spans rather than links: rows of empty links look like trackers to some content blockers, which hide them.
        return el("span", { class: "dot", "data-k": field.length - 1, "data-c": cid, "data-v": e.label,
          style: `--c:${COLORS[cid]}; --d:${300 + ci * 90 + Math.min(i, 40) * 12}ms` });
      });
      cols.append(el("div", { class: "col" }, el("div", { class: "dots" }, dots),
        el("div", { class: "year" }, el("span", { class: "title-4" }, label), el("span", { class: "caption-2 muted" }, String(these.length)))));
    });
    cols.style.setProperty("--n", buckets.length);

    const tip = document.getElementById("tip"), box = document.getElementById("field");
    let shown = null;
    const hide = () => { tip.hidden = true; shown?.classList.remove("on"); shown = null; };
    cols.addEventListener("mouseover", ev => {
      const d = ev.target.closest(".dot");
      if (!d || d === shown) return;
      hide();
      const [e] = field[d.dataset.k];
      tip.replaceChildren(el("p", { class: "title-4" }, e.title),
        el("p", { class: "where caption-2" }, el("span", {}, [e.venue || "Working paper", when(e)].filter(Boolean).join(", ")), tag(e)));
      const r = d.getBoundingClientRect(), b = box.getBoundingClientRect();
      tip.hidden = false;
      const half = tip.offsetWidth / 2;
      tip.style.left = `${Math.min(Math.max(r.left + r.width / 2 - b.left, half), b.width - half)}px`;
      tip.style.top = `${r.top - b.top}px`;
      d.classList.add("on");
      shown = d;
    });
    cols.addEventListener("mouseleave", hide);
    cols.addEventListener("click", ev => {
      const d = ev.target.closest(".dot");
      const [e] = d ? field[d.dataset.k] : [];
      if (!e) return;
      hide();
      e.anchor ? jumpTo(e.anchor) : window.open(e.url, "_blank", "noopener");
    });
  }

  function renderHeader() {
    const rows = listed(), n = total();
    document.getElementById("lede").textContent =
      `${n} papers on LLMs that simulate consumers, generate marketing content, and improve marketing models.`;
    const proof = document.getElementById("proof");
    Object.keys(VENUES).forEach(k => {
      const c = rows.filter(([e]) => e.label === k).length;
      if (c) proof.append(el("button", { class: "vchip", type: "button", "data-venue": k, style: `--t:${VCOLOR[k]}`,
        "aria-label": `${VENUES[k]}, ${c} papers`, onclick: () => setVenue(k) }, VENUES[k], el("span", { "aria-hidden": "true" }, String(c))));
    });
    proof.append(el("span", { class: "updated caption-2 muted" }, `Updated ${longDate(data.updated)}`));
    document.getElementById("foot").textContent = `${n} papers. Updated ${longDate(data.updated)}.`;

    renderField();
    const legend = document.getElementById("legend"), chips = document.getElementById("chips");
    data.categories.forEach(c => legend.append(el("button", { class: "dir", type: "button", style: `--c:${COLORS[c.id]}`, "data-cat": c.id,
      title: `${sentence(c.name)}: ${c.blurb}`, onclick: () => setCat(c.id) }, el("i", { "aria-hidden": "true" }), SHORT[c.id], el("span", {}, String(c.count)))));
    chips.append(el("button", { class: "chip", type: "button", "data-cat": "", onclick: () => { state.cat = null; render(); } }, "All"));
    data.categories.forEach(c => chips.append(el("button", { class: "chip", type: "button", style: `--c:${COLORS[c.id]}`, "data-cat": c.id,
      onclick: () => setCat(c.id) }, SHORT[c.id])));
    const cols = document.getElementById("cols");
    const preview = (sel, key, attr) => document.querySelectorAll(sel).forEach(b => {
      b.addEventListener("mouseenter", () => { cols.dataset[key] = b.dataset[attr]; });
      b.addEventListener("mouseleave", () => { delete cols.dataset[key]; });
    });
    preview("#legend .dir", "pc", "cat");
    preview("#proof .vchip", "pv", "venue");
    const venues = document.getElementById("venues");
    Object.entries(VENUES).forEach(([k, v]) => venues.append(el("button", { class: "chip", type: "button", "data-venue": k,
      style: `--c:${VCOLOR[k]}`, onclick: () => setVenue(k) }, v)));

    // Foundational papers take the colour of the direction they are filed under, if any.
    const home = new Map(data.categories.flatMap(c => c.subsections.flatMap(s => s.entries.map(e => [e.title, c.id]))));
    const fl = document.getElementById("foundational");
    data.foundational.forEach(e => fl.append(entryNode(e, home.has(e.title) ? COLORS[home.get(e.title)] : "var(--muted)")));
    reveal(document.getElementById("start"));
  }

  function matches(e) {
    if (state.venue && e.label !== state.venue) return false;
    if (state.published && !e.published) return false;
    if (state.datasets && !e.data_url) return false;
    if (state.q) {
      const hay = fold(`${e.title} ${e.authors} ${e.venue} ${e.data_desc} ${e.tldr} ${e.year || ""}`);
      if (!fold(state.q).split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  }

  function render() {
    writeHash();
    document.getElementById("q").value = state.q;
    document.getElementById("published").checked = state.published;
    document.getElementById("datasets").checked = state.datasets;
    document.getElementById("sort").value = state.sort;
    document.querySelectorAll("#legend [data-cat], #chips [data-cat]").forEach(b =>
      b.setAttribute("aria-pressed", String((b.dataset.cat || null) === state.cat)));
    document.querySelectorAll("[data-venue]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.venue === state.venue)));

    const main = document.getElementById("catalogue");
    main.replaceChildren();
    const cats = data.categories.filter(c => !state.cat || c.id === state.cat);
    let shown = 0;

    if (state.sort === "newest") {
      const rows = [];
      cats.forEach(c => c.subsections.forEach(s => s.entries.forEach(e => {
        if (!e.canonical && matches(e)) rows.push([e, c, `${s.id} ${sentence(s.name)}`]);
      })));
      rows.sort((a, b) => (b[0].year || 0) - (a[0].year || 0) || (b[0].month || 0) - (a[0].month || 0));
      shown = rows.length;
      if (rows.length) main.append(el("section", { class: "cat", "aria-label": "Papers, newest first" },
        el("ul", { class: "entries" }, rows.map(([e, c, s]) => entryNode(e, COLORS[c.id], s)))));
    } else {
      cats.forEach(c => {
        const subs = c.subsections.map(s => [s, s.entries.filter(matches)]).filter(([, es]) => es.length);
        if (!subs.length) return;
        main.append(reveal(el("section", { class: "cat", style: `--c:${COLORS[c.id]}`, "aria-labelledby": `cat-${c.id}` },
          el("h2", { class: "heading-4", id: `cat-${c.id}` }, `${c.id}. ${sentence(c.name)}`),
          el("p", { class: "body-3 muted" }, capital(c.blurb)),
          subs.map(([s, es]) => {
            shown += es.filter(e => !e.canonical).length;
            return el("div", { class: "subsec" },
              el("h3", { class: "heading-6" }, `${s.id} ${sentence(s.name)}`, el("span", { class: "n" }, String(es.length))),
              el("ul", { class: "entries" }, es.map(e => entryNode(e, COLORS[c.id]))));
          }))));
      });
    }
    revealed = true;

    // The field dims every paper the current filters leave out.
    document.querySelectorAll("#cols .dot").forEach(d => {
      const [e, cid] = field[d.dataset.k];
      d.classList.toggle("dim", (state.cat && cid !== state.cat) || !matches(e));
    });
    const filtered = state.q || state.cat || state.venue || state.published || state.datasets;
    document.getElementById("field-cap").textContent = filtered
      ? `${shown} of ${total()} papers match.`
      : matchMedia("(hover: hover)").matches ? "One dot per paper. Hover a dot for its title." : "One dot per paper. Tap a dot to jump to it.";
    document.getElementById("status").replaceChildren(filtered ? `Showing ${shown} of ${total()} papers. ` : `${total()} papers.`,
      filtered ? el("button", { class: "link-btn", type: "button", onclick: clear }, "Clear filters") : "");
    const expand = document.getElementById("expand");
    expand.textContent = openAll ? "Hide all summaries" : "Show all summaries";
    expand.hidden = !shown || !listed().some(([e]) => e.tldr);
    if (!shown) main.append(el("div", { class: "notice" },
      el("p", { class: "title-3" }, "No papers match these filters."),
      el("p", { class: "body-6 muted" }, "Try fewer words, or clear the filters to see the full list."),
      el("button", { class: "btn button-md", type: "button", onclick: clear }, "Clear filters")));
  }

  function clear() {
    Object.assign(state, { q: "", cat: null, venue: null, published: false, datasets: false });
    render();
  }

  function follow() {
    readHash();
    render();
    // Entries are built after the fragment is set, so :target never matches them; mark the hit by hand.
    const hit = anchor() && document.getElementById(anchor());
    if (hit) { hit.classList.add("hit"); hit.closest(".reveal")?.classList.add("in"); hit.scrollIntoView({ behavior: calm.matches ? "auto" : "smooth" }); }
  }
  addEventListener("hashchange", () => data && follow());

  let t;
  document.getElementById("q").addEventListener("input", ev => { clearTimeout(t); t = setTimeout(() => { state.q = ev.target.value.trim(); render(); }, 120); });
  document.getElementById("published").addEventListener("change", ev => { state.published = ev.target.checked; render(); });
  document.getElementById("datasets").addEventListener("change", ev => { state.datasets = ev.target.checked; render(); });
  document.getElementById("sort").addEventListener("change", ev => { state.sort = ev.target.value; render(); });
  document.getElementById("expand").addEventListener("click", () => { openAll = !openAll; if (!openAll) opened.clear(); render(); });
  document.getElementById("browse").addEventListener("click", ev => { ev.preventDefault(); toList(); });

  // Revalidate on every visit so a regenerated snapshot shows up at once.
  fetch("papers.json", { cache: "no-cache" }).then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }).then(d => {
    data = d;
    renderHeader();
    follow();
  }).catch(err => {
    document.getElementById("catalogue").replaceChildren(el("div", { class: "notice", role: "alert" },
      el("p", { class: "title-3" }, "The paper list could not be loaded."),
      el("p", { class: "body-6 muted" }, /^https?:$/.test(location.protocol)
        ? `The request failed (${err.message}). Reload the page to try again.`
        : "This page was opened as a file, so it cannot read papers.json. Open it through a web server, for example hugo server.")));
  });
})();
</script>
</body>
</html>
